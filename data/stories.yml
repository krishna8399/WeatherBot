version: "3.1"  # Rasa Core stories schema version

stories:  # Example conversational paths to teach dialogue policies
- story: greet and suggest questions
  steps:
  - intent: greet
  - action: utter_greet_with_suggestion

- story: simple weather query  # Ask weather -> get brief weather response
  steps:
  - intent: ask_weather
    entities:
    - location: London
  - action: action_weather_brief

- story: weather detail query  # Ask specific weather detail
  steps:
  - intent: weather_detail_query
    entities:
    - location: London
    - weather_detail: humidity
  - action: action_weather_detail

- story: direct outfit request  # User explicitly asks for outfit suggestion
  steps:
  - intent: ask_outfit
    entities:
    - location: London
  - action: action_provide_outfit
