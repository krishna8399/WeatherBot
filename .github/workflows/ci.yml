name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Rasa data
        run: |
          rasa data validate --no-prompt
      - name: Run unit tests
        run: |
          pytest -q tests/test_actions.py
